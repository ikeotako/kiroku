<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --bg:#2C5482; --hd:#1C3D63; --cd:#34618F; --cd2:#3B6B9B; --spine:#17355A;
  --ln:#7FA3C6; --ln2:#5580AB; --gl:#4A76A3;
  --tx:#ECF1F8; --tx2:#B0C5DE; --tx3:#8FA9CC; --tx4:#7A96BC;
  --ac:#F0A22E; --acx:#4E3B30;
  --w0:#D3798E; --w1:#8189C4; --w2:#E08155; --w3:#4FA3A0; --w4:#7BA75C; --w5:#D3A03C; --w6:#5B8AC4;
  --dw:#5FC2BC; --dc:#B08968; --dj:#E3B657; --ds:#C98FA8;
}
html,body{ margin:0; padding:0; background:var(--hd); -webkit-text-size-adjust:100%; }
body{ font-family:"Yomogi", "Hiragino Sans", sans-serif; }
.app{
  background:var(--bg); color:var(--tx); max-width:520px; margin:0 auto; min-height:100vh;
  padding-top:env(safe-area-inset-top); line-height:1.7; position:relative;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),
                   repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0 1px,transparent 1px 3px);
}
/* nav */
.nav{ background:var(--hd); display:flex; position:sticky; top:0; z-index:30; }
.nav button{ flex:1; padding:10px 1px 8px; border:none; background:none; font:inherit; font-size:11px;
  color:#8098BA; cursor:pointer; border-bottom:2px solid transparent; }
.nav button.on{ color:var(--tx); border-bottom-color:var(--ac); }
.nav .me{ flex:0 0 34px; border-left:1px solid #2A5182; display:flex; align-items:center; justify-content:center; }
.nav .me i{ width:18px; height:18px; border-radius:50%; border:1.5px solid #8098BA; display:block; }
.nav .me.on i{ border-color:var(--ac); }
.pg{ display:none; padding:14px 13px calc(30px + env(safe-area-inset-bottom)); }
.pg.on{ display:block; }
/* bits */
.cd{ background:var(--cd); border:1px dashed var(--ln); border-radius:12px; padding:10px 12px 11px; margin-bottom:10px; }
.lb{ font-size:11.5px; color:var(--tx2); }
.val{ font-size:20px; color:var(--tx); }
.val.none{ color:var(--tx4); }
.u{ font-size:11px; color:var(--tx2); }
.rw{ display:flex; align-items:flex-end; justify-content:space-between; gap:8px; margin-top:3px; }
.b{ width:29px; height:29px; flex:0 0 29px; border-radius:50%; background:var(--ac); color:var(--acx);
   font:inherit; font-size:14px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.b:active{ transform:translateY(1px); }
.b.lg{ width:32px; height:32px; flex:0 0 32px; font-size:17px; }
.lk{ background:none; border:none; font:inherit; font-size:11.5px; color:var(--tx3); cursor:pointer;
   text-decoration:underline; text-underline-offset:3px; padding:0; }
.lk:hover{ color:var(--tx); }
.hint{ font-size:11px; color:var(--tx3); margin:5px 0 0; }
.empty{ font-size:12.5px; color:var(--tx3); margin:0; }
h2.dt{ font-size:22px; font-weight:400; margin:0; }
.yr{ font-size:11px; color:var(--tx3); letter-spacing:.12em; }
/* 吹き出し */
.bub{ position:relative; background:var(--cd2); border:1px dashed #8FB0CE; border-radius:13px;
  padding:10px 12px 11px; margin:12px 0 17px; display:flex; gap:10px; align-items:flex-start; }
.bub .tail{ position:absolute; left:28px; bottom:-7px; width:13px; height:13px; background:var(--cd2);
  border-left:1px dashed #8FB0CE; border-bottom:1px dashed #8FB0CE; transform:rotate(-45deg); }
.bub .k{ font-size:10.5px; color:#A9C2DC; letter-spacing:.08em; }
.bub .t{ font-size:13.5px; color:var(--tx); line-height:1.7; }
/* meals */
.ml{ display:flex; gap:9px; align-items:center; padding:6px 0; border-bottom:1px dashed var(--ln2); }
.ml:last-of-type{ border-bottom:none; }
.ml .t{ font-size:12px; color:var(--tx2); flex:0 0 36px; }
.ml .n{ font-size:14px; color:var(--tx); flex:1; min-width:0; word-break:break-word; }
.ml .k{ font-size:11px; color:var(--tx3); }
.ml img{ width:40px; height:40px; flex:0 0 40px; border-radius:8px; object-fit:cover; }
.chips{ display:flex; flex-wrap:wrap; gap:4px; }
.chip{ font-size:11px; color:var(--acx); background:#C8D6E4; border-radius:99px; padding:2px 9px; border:none; font:inherit; cursor:pointer; }
.chip.gh{ background:none; border:1px dashed var(--ln); color:#C3D4E6; }
/* toggles */
.tg{ display:flex; gap:5px; }
.tg button{ flex:1; padding:8px 2px; border-radius:9px; border:1px dashed var(--ln); background:none;
  font:inherit; font-size:12px; color:#C3D4E6; cursor:pointer; }
.tg button.on{ background:var(--ac); color:var(--acx); border-style:solid; border-color:var(--ac); }
.unit{ display:flex; border:1px dashed var(--ln); border-radius:9px; overflow:hidden; }
.unit button{ flex:1; padding:8px 0; border:none; background:none; font:inherit; font-size:12px; color:#C3D4E6; cursor:pointer; }
.unit button.on{ background:var(--ac); color:var(--acx); }
/* form */
label.f{ display:block; margin-bottom:11px; }
label.f > span.k{ display:block; font-size:10.5px; color:#A9C2DC; letter-spacing:.06em; margin-bottom:4px; }
input,select,textarea{ width:100%; background:var(--cd2); border:1px dashed #8FB0CE; border-radius:9px;
  padding:9px 11px; font:inherit; font-size:15px; color:var(--tx); }
input::placeholder{ color:#8AA6C6; }
input:focus,select:focus,textarea:focus{ outline:none; border-style:solid; border-color:var(--ac); }
select{ -webkit-appearance:none; appearance:none; }
textarea{ min-height:70px; font-size:14px; resize:vertical; }
.r2{ display:flex; gap:9px; } .r2 > *{ flex:1; }
.calc{ background:var(--cd2); border:1px dashed #8FB0CE; border-radius:9px; padding:8px 11px; font-size:12px; color:var(--tx2); }
.calc b{ font-weight:400; font-size:15px; color:var(--tx); margin:0 6px; }
/* sheet */
.sbg{ position:fixed; inset:0; background:rgba(14,30,52,.5); display:flex; align-items:flex-end; justify-content:center; z-index:60; }
.sh{ background:var(--bg); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:17px 14px calc(22px + env(safe-area-inset-bottom));
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
  animation:up .2s ease; }
@keyframes up{ from{ transform:translateY(20px); opacity:.4 } }
.sh h3{ font-size:17px; font-weight:400; margin:0 0 14px; letter-spacing:.06em; }
.acts{ display:flex; gap:9px; margin-top:16px; }
.acts button{ flex:1; padding:11px; border-radius:99px; font:inherit; font-size:14px; cursor:pointer;
  background:var(--ac); color:var(--acx); border:none; }
.acts button.q{ background:none; color:#C3D4E6; border:1px dashed var(--ln); }
.sugg{ margin-top:5px; border:1px dashed var(--ln2); border-radius:9px; overflow:hidden; }
.sugg button{ display:block; width:100%; text-align:left; padding:9px 12px; border:none;
  border-bottom:1px dashed var(--ln2); background:var(--cd); font:inherit; font-size:14px; color:var(--tx); cursor:pointer; }
.sugg button:last-child{ border-bottom:none; }
.sugg small{ color:var(--tx3); font-size:11px; margin-left:6px; }
/* calendar */
.cnav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
.cnav .mo{ font-size:18px; }
.wd{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:4px; }
.wd span{ font-size:9.5px; text-align:center; }
.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cell{ aspect-ratio:1; border:1px dashed var(--gl); border-radius:7px; background:none; padding:0;
  position:relative; overflow:hidden; cursor:pointer; }
.cell.bl{ border-color:transparent; cursor:default; }
.cell.today{ border-color:var(--tx2); border-style:solid; }
.cell img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cell .n{ position:absolute; top:0; left:3px; font-size:9px; color:var(--tx3); z-index:2; }
.cell.has .n{ color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.75); }
/* notebook */
.book{ display:flex; border-radius:11px 3px 3px 11px; overflow:hidden; box-shadow:0 3px 16px rgba(15,32,58,.3); }
.spine{ width:13px; flex:0 0 13px; background:var(--spine);
  background-image:repeating-linear-gradient(var(--spine) 0 24px,#20456F 24px 28px); }
.page{ flex:1; background:var(--cd); padding:13px 12px 20px; min-height:300px; }
.bookwrap{ position:relative; padding-right:26px; }
.tabs{ position:absolute; top:14px; right:0; display:flex; flex-direction:column; gap:5px; }
.tabs button{ width:24px; border-radius:0 7px 7px 0; border:none; font:inherit; font-size:9.5px;
  padding:9px 0; cursor:pointer; writing-mode:vertical-rl; color:#F4F8FB; }
.tabs button.on{ width:31px; background:var(--cd) !important; color:var(--tx); }
.rule{ background-image:repeating-linear-gradient(transparent 0 30px,#48769F 30px 31px); }
.rule > div{ height:31px; display:flex; align-items:center; gap:7px; }
.seg{ display:flex; gap:5px; margin-bottom:11px; }
.seg button{ flex:1; padding:7px; border-radius:9px; border:1px dashed var(--ln); background:none;
  font:inherit; font-size:12px; color:var(--tx2); cursor:pointer; }
.seg button.on{ background:var(--ac); color:var(--acx); border-style:solid; border-color:var(--ac); }
.nch{ display:flex; gap:4px; flex-wrap:wrap; margin-bottom:11px; }
.nch button{ font:inherit; font-size:11px; border-radius:99px; padding:2px 9px; cursor:pointer;
  background:#C8D6E4; color:var(--acx); border:none; }
.nch button.on{ background:var(--cd2); color:var(--tx); border:1px solid #8FB0CE; }
.nch button.z{ background:none; border:1px dashed var(--ln2); color:var(--tx3); }
/* misc */
.tally{ display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px dashed var(--ln2); }
.tally:last-child{ border-bottom:none; }
.plot{ width:100%; display:block; }
.bar{ display:flex; height:9px; border-radius:99px; overflow:hidden; margin:8px 0 7px; }
.lg{ display:flex; gap:9px; flex-wrap:wrap; font-size:10.5px; color:#C3D4E6; }
.lg i{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
.toast{ position:fixed; left:0; right:0; bottom:0; text-align:center; font-size:11.5px; z-index:80;
  background:var(--hd); color:var(--tx); padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  transform:translateY(110%); transition:transform .2s ease; }
.toast.on{ transform:translateY(0); }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>

/* ---------- photos ---------- */
function phk(m){return "kiroku-ph-"+m;}
function loadPh(m){ if(phL[m])return Promise.resolve();
  return Store.get(phk(m)).then(function(v){PH[m]=v?JSON.parse(v):{};phL[m]=1;})
  .catch(function(){PH[m]={};phL[m]=1;}); }
function savePh(m){return Store.set(phk(m),JSON.stringify(PH[m]||{}))
  .then(function(){toast("保存しました");}).catch(function(){toast("写真を保存できませんでした");});}
function getPh(k,id){var m=PH[mk(k)];return m?(m[id]||null):null;}
function setPh(k,id,d){var m=mk(k);PH[m]=PH[m]||{};phL[m]=1;if(d)PH[m][id]=d;else delete PH[m][id];return savePh(m);}
function shrink(f,cb){var u=URL.createObjectURL(f),i=new Image();
  i.onload=function(){var M=340,w=i.naturalWidth,h=i.naturalHeight,s=Math.min(1,M/Math.max(w,h));
    var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
    var c=document.createElement("canvas");c.width=cw;c.height=ch;
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cw,ch);x.drawImage(i,0,0,cw,ch);
    URL.revokeObjectURL(u);try{cb(c.toDataURL("image/jpeg",.6));}catch(e){cb(null);}};
  i.onerror=function(){URL.revokeObjectURL(u);cb(null);};i.src=u;}

/* ---------- helpers ---------- */
function day(k,mkNew){if(!S.days[k]&&mkNew)S.days[k]={wake:null,sleep:null,weight:null,bp:null,steps:null,meals:[]};return S.days[k]||null;}
function tidy(k){var d=S.days[k];if(!d)return;
  if(!d.meals||!d.meals.length){d.fact=null;d.factN=null;}
  if(!d.wake&&!d.sleep&&d.weight==null&&!d.bp&&d.steps==null&&(!d.meals||!d.meals.length))delete S.days[k];}
function nowHM(){var n=new Date();return pad(n.getHours())+":"+pad(n.getMinutes());}
function r15(hm){var a=hm.split(":"),h=+a[0],m=Math.round(+a[1]/15)*15;if(m===60){m=0;h=(h+1)%24;}return pad(h)+":"+pad(m);}
function topts(c){var o="";for(var h=0;h<24;h++)for(var m=0;m<60;m+=15){var v=pad(h)+":"+pad(m);
  o+='<option value="'+v+'"'+(v===c?" selected":"")+">"+v+"</option>";}return o;}
function tmean(a){if(!a.length)return null;var s=a.slice().sort(function(x,y){return x-y;});
  var k=Math.floor(s.length*.25),t=s.slice(k,s.length-k);if(!t.length)t=s;
  return t.reduce(function(x,y){return x+y;},0)/t.length;}
function num(v){var x=parseFloat(v);return isNaN(x)?null:x;}

/* 栄養計算 */
function mealCalc(m){
  if(m.kcalManual!=null)return {kcal:m.kcalManual,p:m.proManual,src:"manual"};
  var kc=0,pr=0,got=false;
  if(m.items&&m.items.length){
    m.items.forEach(function(it){var c=COMP[it.n];if(c&&it.a){got=true;kc+=c[0]*it.a/100;pr+=c[1]*it.a/100;}});
  }
  if(m.drink==="sake"&&m.amount&&m.abv){ got=true; kc+=m.amount*m.abv/100*.8*7; }
  var mf=S.myFoods.filter(function(f){return f.name===m.name;})[0];
  if(!got&&mf&&mf.kcal!=null&&m.amount){got=true;kc+=mf.kcal*m.amount/(mf.per||100);
    if(mf.protein!=null)pr+=mf.protein*m.amount/(mf.per||100);}
  if(!got&&COMP[m.name]&&m.amount){got=true;kc+=COMP[m.name][0]*m.amount/100;pr+=COMP[m.name][1]*m.amount/100;}
  return got?{kcal:kc,p:pr,src:"calc"}:{kcal:null,p:null,src:"none"};
}
function pureAlc(m){ if(m.drink!=="sake"||!m.amount||!m.abv)return null; return m.amount*m.abv/100*.8; }
function waterOf(d){ var t={water:0,coffee:0,juice:0,sake:0};
  (d&&d.meals||[]).forEach(function(m){ if(m.cat==="nom"&&m.drink&&m.amount)t[m.drink]+=m.amount; });
  return t; }

/* 豆知識 */
function factId(f,i){return f+"|"+i;}
function foodsIn(m){var set={},names=Object.keys(FACTS);
  function scan(t){if(!t)return;names.forEach(function(n){if(t.indexOf(n)>=0)set[n]=1;});}
  scan(m.name);(m.items||[]).forEach(function(it){scan(it.n);});return Object.keys(set);}
function pickFact(k){
  var d=S.days[k];if(!d||!d.meals||!d.meals.length)return null;
  var pool=[];
  d.meals.forEach(function(m){foodsIn(m).forEach(function(f){
    FACTS[f].f.forEach(function(x,i){pool.push({f:f,i:i,k:x[0],t:x[1]});});});});
  if(!pool.length)return null;
  var fresh=pool.filter(function(p){return !S.seen[factId(p.f,p.i)];});
  var list=fresh.length?fresh:pool;
  var seed=0;for(var j=0;j<k.length;j++)seed+=k.charCodeAt(j);
  seed+=d.meals.length*7;
  return list[seed%list.length];
}
function todayFact(k){
  var d=S.days[k]; if(!d||!d.meals||!d.meals.length)return null;
  var n=d.meals.length;
  if(!d.fact||d.factN!==n){
    var p=pickFact(k); if(!p)return null;
    d.fact={f:p.f,i:p.i}; d.factN=n; S.seen[factId(p.f,p.i)]=1; save();
  }
  var F=FACTS[d.fact.f]; if(!F||!F.f[d.fact.i])return null;
  return {f:d.fact.f,i:d.fact.i,k:F.f[d.fact.i][0],t:F.f[d.fact.i][1]};
}

/* ---------- sheet ---------- */
function sheet(title,html,mount){
  $("host").innerHTML='<div class="sbg" id="sbg"><div class="sh" role="dialog" aria-modal="true">'
    +'<h3>'+esc(title)+'</h3>'+html+'</div></div>';

  if(mount)mount();
}

/* ---------- 花 ---------- */
function flower(size,col){
  col=col||"#E9A0B4";var g="";
  for(var i=0;i<5;i++){g+='<g transform="rotate('+(i*72)+')"><ellipse rx="4.8" ry="8.6" cy="-9.6" fill="'+col+'"/>'
    +'<path d="M-2.9 -12.4h5.8M-3.5 -9.6h7M-2.9 -6.8h5.8" stroke="#FBE2E8" stroke-width=".55" stroke-linecap="round" opacity=".8"/></g>';}
  return '<svg viewBox="-20 -20 40 40" style="width:'+size+'px;flex:0 0 '+size+'px" aria-hidden="true">'+g
    +'<circle r="4" fill="#F0C56B"/><circle cx="-1.4" cy="-1" r=".9" fill="#C9974A"/>'
    +'<circle cx="1.5" cy="-.5" r=".9" fill="#C9974A"/><circle cx="0" cy="1.6" r=".9" fill="#C9974A"/></svg>';
}

  var w=waterOf(d), tot=w.water+w.coffee+w.juice;

   +'<input type="file" id="phf" accept="image/*" hidden>'

   +'<div id="amtwrap"></div>'
   +'<label class="f"><span class="k" id="itlb">具材（任意・入れなくても記録は完成です）</span>'
     +'<div class="chips" id="its" style="margin-bottom:7px"></div><div id="rcs"></div>'
     +'<div class="r2"><input type="text" id="itn" placeholder="豚バラ肉"><input type="number" inputmode="decimal" id="ita" placeholder="g" style="max-width:88px"></div>'
     +'<button class="chip gh" id="itadd" style="margin-top:7px">具材を足す</button></label>'
   +'<div class="calc" id="calc"></div>'
   +'<label class="f" style="margin-top:11px"><span class="k">自分で数値を入れる（任意）</span>'
     +'<div class="r2"><input type="number" inputmode="numeric" id="kc" placeholder="kcal" value="'+(D.kcalManual!=null?D.kcalManual:"")+'">'
     +'<input type="number" inputmode="decimal" id="pr" placeholder="たんぱく質 g" value="'+(D.proManual!=null?D.proManual:"")+'"></div></label>'

      if($("ab"))$("ab").oninput=function(){D.abv=num($("ab").value);pcalc();};

    function pit(){
      $("itlb").textContent=(D.cat==="nom"&&D.drink==="coffee")?"入れたもの（任意）":"具材（任意・入れなくても記録は完成です）";
      $("its").innerHTML=D.items.length?D.items.map(function(it,i){
        return '<button class="chip" data-i="'+i+'">'+esc(it.n)+(it.a?" "+it.a+(it.u||"g"):"")+' ×</button>';}).join("")
        :'<span class="hint" style="margin:0">なし</span>';
      Array.prototype.forEach.call($("its").children,function(c){ if(!c.getAttribute)return;
        var i=c.getAttribute("data-i"); if(i===null)return;
        c.onclick=function(){D.items.splice(+i,1);pit();prc();pcalc();};});
    }
    function prc(){
      var r=S.recipes[$("nm").value.trim()]||(DISHES[$("nm").value.trim()]?{items:DISHES[$("nm").value.trim()].i.map(function(x){return {n:x[0],a:x[1],u:"g"};})}:null);
      if(!r||!r.items){$("rcs").innerHTML="";return;}
      var have={};D.items.forEach(function(x){have[x.n]=1;});
      var miss=r.items.filter(function(x){return !have[x.n];});
      if(!miss.length){$("rcs").innerHTML="";return;}
      $("rcs").innerHTML='<p class="hint" style="margin:0 0 5px">前回の具材：</p><div class="chips" id="rcc" style="margin-bottom:7px">'
        +miss.map(function(x,i){return '<button class="chip gh" data-j="'+i+'">＋ '+esc(x.n)+(x.a?" "+x.a+(x.u||"g"):"")+'</button>';}).join("")
        +'<button class="chip gh" data-all="1">＋ ぜんぶ</button></div>';
      Array.prototype.forEach.call($("rcc").children,function(c){
        c.onclick=function(){ if(c.getAttribute("data-all")){miss.forEach(function(x){D.items.push({n:x.n,a:x.a,u:x.u||"g"});});}
          else {var x=miss[+c.getAttribute("data-j")];D.items.push({n:x.n,a:x.a,u:x.u||"g"});}
          pit();prc();pcalc();};});
    }
    function psg(){
      var q=$("nm").value.trim(),host=$("sg");
      if(!q){host.innerHTML="";return;}
      var hits=[];
      Object.keys(DISHES).forEach(function(n){if(n.indexOf(q)>=0&&n!==q)hits.push({n:n,s:"定番"});});
      S.myFoods.forEach(function(f){if(f.name.indexOf(q)>=0&&f.name!==q)hits.push({n:f.name,s:"マイ食品"});});
      Object.keys(S.recipes).forEach(function(n){if(n.indexOf(q)>=0&&n!==q)hits.push({n:n,s:"レシピ帳"});});
      hits=hits.slice(0,5);
      if(!hits.length){host.innerHTML="";return;}
      host.innerHTML='<div class="sugg">'+hits.map(function(x,i){return '<button data-i="'+i+'">'+esc(x.n)+'<small>'+x.s+'</small></button>';}).join("")+'</div>';
      Array.prototype.forEach.call(host.querySelectorAll("button"),function(b){
        b.onclick=function(){ var x=hits[+b.getAttribute("data-i")];
          $("nm").value=x.n;D.name=x.n;
          if(DISHES[x.n]){D.cat=DISHES[x.n].c;pk();pdrk();}
          if(S.recipes[x.n]){D.cat=S.recipes[x.n].cat||D.cat;D.drink=S.recipes[x.n].drink||D.drink;pk();pdrk();}
          host.innerHTML="";prc();pamt();pcalc();};});
    }
    function pcalc(){
      D.name=$("nm").value.trim();
      var c=mealCalc(D),pa=pureAlc(D),bits=[];
      if(c.kcal!=null)bits.push('<b>'+Math.round(c.kcal)+'</b>kcal');
      if(c.p)bits.push('<b>'+c.p.toFixed(1)+'</b>g たんぱく質');
      if(pa!=null)bits.push('<b>'+pa.toFixed(1)+'</b>g 純アルコール');
      var wt=(D.cat==="nom"&&D.drink&&D.drink!=="sake"&&D.amount)?'／ 水分 '+Math.round(D.amount)+'ml'
            :(D.drink==="sake"?'／ 水分には数えません':'');
      $("calc").innerHTML=bits.length?('おおよそ '+bits.join(" ")+' <span style="font-size:11px;color:var(--tx3)">'+wt+'</span>')
        :'<span style="color:var(--tx3)">数値は空のままでも記録できます。'+wt+'</span>';
    }
    function pph(){
      $("phw").innerHTML=photo
        ?'<img src="'+photo+'" style="width:72px;height:72px;object-fit:cover;border-radius:10px" alt=""><button class="chip gh" id="phd">写真を消す</button>'
        :'<button class="chip gh" id="pha" style="padding:8px 14px">写真をとる／選ぶ</button><span class="hint" style="margin:0">なくても大丈夫です</span>';
      if($("pha"))$("pha").onclick=function(){$("phf").click();};
      if($("phd"))$("phd").onclick=function(){photo=null;pDirty=true;pph();};
    }
    $("phf").onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;
      shrink(f,function(dd){if(!dd){toast("この写真は読み込めませんでした");return;}photo=dd;pDirty=true;pph();});};
    Array.prototype.forEach.call($("cat").children,function(b){
      b.onclick=function(){D.cat=b.getAttribute("data-v");
        if(D.cat==="nom"&&!D.drink)D.drink="water";
        if(D.cat!=="nom")D.drink=null;
        if(D.cat==="nom"&&D.unit==="g")D.unit="ml";
        pk();pdrk();pamt();pit();pcalc();};});
    $("nm").oninput=function(){psg();prc();pcalc();};
    $("itadd").onclick=function(){var n=$("itn").value.trim();if(!n)return;
      D.items.push({n:n,a:num($("ita").value),u:D.cat==="nom"?"ml":"g"});
      $("itn").value="";$("ita").value="";pit();prc();pcalc();};
    $("itn").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();$("itadd").click();}};
    $("kc").oninput=function(){D.kcalManual=num($("kc").value);pcalc();};
    $("pr").oninput=function(){D.proManual=num($("pr").value);pcalc();};

    pph();pk();pdrk();pamt();pit();prc();pcalc();

    $("ok").onclick=function(){
      D.name=$("nm").value.trim(); if(!D.name){toast("名前を入れてください");return;}
      D.time=$("tm").value; D.hasPhoto=!!photo;
      var dd=day(sel,1); dd.meals=dd.meals||[];
      if(m)dd.meals=dd.meals.map(function(x){return x.id===D.id?D:x;}); else dd.meals.push(D);
      S.recipes[D.name]={cat:D.cat,drink:D.drink,items:D.items.slice(),abv:D.abv};
      if(pDirty)setPh(sel,D.id,photo);
      save();closeSheet();render();
    };
    if($("del"))$("del").onclick=function(){
      var dd=S.days[sel]; if(dd){dd.meals=(dd.meals||[]).filter(function(x){return x.id!==D.id;});tidy(sel);}
      setPh(sel,D.id,null);save();closeSheet();render();};
  });
}

/* =========== カレンダー =========== */
function firstPhoto(k){
  var d=S.days[k];if(!d||!d.meals)return null;
  var ms=d.meals.slice().sort(function(a,b){return a.time<b.time?-1:1;});
  for(var i=0;i<ms.length;i++)if(ms[i].hasPhoto){var p=getPh(k,ms[i].id);if(p)return p;}
  return null;
}
function renderCal(){
  var y=calM.getFullYear(),mo=calM.getMonth();
  var lead=(new Date(y,mo,1).getDay()+6)%7, last=new Date(y,mo+1,0).getDate();
  var h='<div class="cnav"><button class="lk" id="cp">← 前の月</button><span class="mo">'+y+'年'+(mo+1)+'月</span><button class="lk" id="cn">次の月 →</button></div>'
   +'<div class="wd">'+[1,2,3,4,5,6,0].map(function(i){return '<span style="color:'+WCOL[i]+'">'+WD[i]+'</span>';}).join("")+'</div><div class="cal">';
  for(var i=0;i<lead;i++)h+='<div class="cell bl"></div>';
  for(var n=1;n<=last;n++){
    var dt=new Date(y,mo,n),k=dk(dt),src=firstPhoto(k);

      +'<span class="n">'+n+'</span>'+(src?'<img src="'+src+'" alt="">':'')+'</button>';
  }
  h+='</div><p class="hint">日付をタップすると、その日を開いて写真を足せます。</p>';
  $("p-cal").innerHTML=h;
  $("cp").onclick=function(){calM=new Date(y,mo-1,1);render();};
  $("cn").onclick=function(){calM=new Date(y,mo+1,1);render();};
  Array.prototype.forEach.call($("p-cal").querySelectorAll(".cell[data-k]"),function(c){
    c.onclick=function(){sel=c.getAttribute("data-k");go("today");};});
}

/* =========== 記録 =========== */
function spanKeys(){
  if(recSpan==="w"){
    var mon=new Date(recM);mon.setDate(mon.getDate()-((recM.getDay()+6)%7));
    var out=[];for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(d.getDate()+i);out.push(dk(d));}
    return out;
  }
  var y=recM.getFullYear(),mo=recM.getMonth(),last=new Date(y,mo+1,0).getDate(),o=[];
  for(var j=1;j<=last;j++)o.push(dk(new Date(y,mo,j)));
  return o;
}
function hm2n(h,shift){var a=h.split(":"),v=+a[0]+(+a[1])/60;if(shift&&v<12)v+=24;return v;}
function n2hm(v){var w=((v%24)+24)%24,h=Math.floor(w),m=Math.round((w-h)*60);if(m===60){m=0;h=(h+1)%24;}return pad(h)+":"+pad(m);}

function scatter(keys,kind,shift,fmt){
  var pts=[];keys.forEach(function(k,i){var d=S.days[k];if(d&&d[kind])pts.push({i:i,v:hm2n(d[kind],shift),wd:pd(k).getDay()});});
  if(!pts.length)return '<p class="empty">記録がありません</p>';
  var vs=pts.map(function(p){return p.v;});
  var lo=Math.floor(Math.min.apply(null,vs)-.6),hi=Math.ceil(Math.max.apply(null,vs)+.6);
  if(hi-lo<3)hi=lo+3;
  var av=tmean(vs);
  var L=36,R=6,T=10,B=18,W=300,H=118,N=keys.length;
  function px(i){return L+(N<2?0.5:i/(N-1))*(W-L-R);}
  function py(v){return T+(v-lo)/(hi-lo)*(H-T-B);}
  var g="";
  for(var t=Math.ceil(lo);t<=hi;t++){ if((hi-lo)>6&&t%2)continue;
    g+='<line x1="'+L+'" y1="'+py(t).toFixed(1)+'" x2="'+(W-R)+'" y2="'+py(t).toFixed(1)+'" stroke="#4A76A3" stroke-width="1" stroke-dasharray="3 3"/>'
     +'<text x="'+(L-5)+'" y="'+(py(t)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="#8FA9CC">'+n2hm(t)+'</text>';}
  g+='<line x1="'+L+'" y1="'+py(av).toFixed(1)+'" x2="'+(W-R)+'" y2="'+py(av).toFixed(1)+'" stroke="#F0A22E" stroke-width="1.3" stroke-dasharray="5 4"/>';
  pts.forEach(function(p){g+='<circle cx="'+px(p.i).toFixed(1)+'" cy="'+py(p.v).toFixed(1)+'" r="3.6" fill="'+WCOL[p.wd]+'"/>';});
  if(recSpan==="w")keys.forEach(function(k,i){g+='<text x="'+px(i).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="'+WCOL[pd(k).getDay()]+'">'+WD[pd(k).getDay()]+'</text>';});
  else [0,9,19,N-1].forEach(function(i){if(i<N)g+='<text x="'+px(i).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#8FA9CC">'+(i+1)+'</text>';});
  return '<svg class="plot" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>'
   +'<div class="tally" style="border:none;padding:3px 0 0"><span class="lb">平均</span><span style="font-size:17px">'+n2hm(av)+'</span></div>';
}
function lineChart(keys,get,unit,dec){
  var pts=[];keys.forEach(function(k,i){var v=get(S.days[k]);if(v!=null)pts.push({i:i,v:v});});
  if(!pts.length)return '<p class="empty">記録がありません</p>';
  var vs=pts.map(function(p){return p.v;});
  var lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  var pad2=Math.max((hi-lo)*.25,hi*.01,.5);lo-=pad2;hi+=pad2;
  var av=tmean(vs);
  var L=36,R=6,T=10,B=16,W=300,H=104,N=keys.length;
  function px(i){return L+(N<2?.5:i/(N-1))*(W-L-R);}
  function py(v){return T+(hi-v)/(hi-lo)*(H-T-B);}
  var g="";
  [lo+(hi-lo)*.15,(lo+hi)/2,hi-(hi-lo)*.15].forEach(function(t){
    g+='<line x1="'+L+'" y1="'+py(t).toFixed(1)+'" x2="'+(W-R)+'" y2="'+py(t).toFixed(1)+'" stroke="#4A76A3" stroke-width="1" stroke-dasharray="3 3"/>'
     +'<text x="'+(L-5)+'" y="'+(py(t)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="#8FA9CC">'+t.toFixed(dec||0)+'</text>';});
  g+='<path d="'+pts.map(function(p,j){return (j?"L":"M")+px(p.i).toFixed(1)+" "+py(p.v).toFixed(1);}).join(" ")+'" stroke="#A8C5E4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>';
  g+='<line x1="'+L+'" y1="'+py(av).toFixed(1)+'" x2="'+(W-R)+'" y2="'+py(av).toFixed(1)+'" stroke="#F0A22E" stroke-width="1.5"/>';
  pts.forEach(function(p){g+='<circle cx="'+px(p.i).toFixed(1)+'" cy="'+py(p.v).toFixed(1)+'" r="3" fill="#DCEAF6"/>';});
  return '<svg class="plot" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>'
   +'<div class="tally" style="border:none;padding:3px 0 0"><span class="lb">平均</span><span style="font-size:17px">'+av.toFixed(dec||0)+'<span class="u"> '+unit+'</span></span></div>';
}
function barChart(keys,get,unit){
  var vals=keys.map(function(k){return get(S.days[k]);});
  var have=vals.filter(function(v){return v!=null;});
  if(!have.length)return '<p class="empty">記録がありません</p>';
  var hi=Math.max.apply(null,have)*1.15||1;
  var L=6,W=300,H=86,B=18,N=keys.length,bw=Math.max(3,(W-L*2)/N-3);
  var g="";
  vals.forEach(function(v,i){ if(v==null)return;
    var x=L+i*((W-L*2)/N)+1.5,hh=(v/hi)*(H-B-6);
    g+='<rect x="'+x.toFixed(1)+'" y="'+(H-B-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="2" fill="'+WCOL[pd(keys[i]).getDay()]+'"/>';});
  g+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-L)+'" y2="'+(H-B)+'" stroke="#5B8AC4" stroke-width="1"/>';
  if(recSpan==="w")keys.forEach(function(k,i){var x=L+i*((W-L*2)/N)+bw/2+1.5;
    g+='<text x="'+x.toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="8.5" fill="'+WCOL[pd(k).getDay()]+'">'+WD[pd(k).getDay()]+'</text>';});
  return '<svg class="plot" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>'
   +'<div class="tally" style="border:none;padding:3px 0 0"><span class="lb">平均</span><span style="font-size:17px">'+Math.round(tmean(have)).toLocaleString()+'<span class="u"> '+unit+'</span></span></div>';
}
function drinkChart(keys){
  var rows=keys.map(function(k){return waterOf(S.days[k]);});
  var tots=rows.map(function(r){return r.water+r.coffee+r.juice+r.sake;});
  if(!tots.some(function(t){return t>0;}))return '<p class="empty">記録がありません</p>';
  var legend='<div class="lg" style="margin-top:8px">'
    +'<span><i style="background:var(--dw)"></i>水・お茶</span><span><i style="background:var(--dc)"></i>コーヒー</span>'
    +'<span><i style="background:var(--dj)"></i>ジュース</span><span><i style="background:var(--ds)"></i>お酒</span></div>';
  if(recSpan==="m"){
    var out='';
    [["water","水・お茶","var(--dw)"],["coffee","コーヒー","var(--dc)"],["juice","ジュース","var(--dj)"],["sake","お酒","var(--ds)"]].forEach(function(x){
      var v=rows.map(function(r){return r[x[0]];}).filter(function(v2,i){return tots[i]>0;});
      var a=v.length?tmean(v):0;
      out+='<div class="tally"><span style="font-size:13px"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+x[2]+';margin-right:6px"></i>'+x[1]+'</span>'
        +'<span style="font-size:16px">'+Math.round(a).toLocaleString()+'<span class="u"> ml</span></span></div>';});
    var wv=rows.map(function(r){return r.water+r.coffee+r.juice;}).filter(function(v2,i){return tots[i]>0;});
    out+='<div class="tally" style="border-top:1px dashed var(--ln2);border-bottom:none;margin-top:4px"><span style="font-size:13px">水分の合計（お酒を除く）</span>'
      +'<span style="font-size:17px">'+Math.round(wv.length?tmean(wv):0).toLocaleString()+'<span class="u"> ml</span></span></div>';
    return '<p class="hint" style="margin:0 0 6px">1日あたりの平均</p>'+out;
  }
  var hi=Math.max.apply(null,tots)*1.12||1;
  var L=34,W=300,H=132,B=20,N=keys.length,bw=(W-L-8)/N-6;
  var g="";
  [.33,.66,1].forEach(function(f){var y=10+(1-f)*(H-B-16);
    g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-6)+'" y2="'+y.toFixed(1)+'" stroke="#4A76A3" stroke-width="1" stroke-dasharray="3 3"/>'
     +'<text x="'+(L-5)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="7.5" fill="#8FA9CC">'+Math.round(hi*f)+'</text>';});
  rows.forEach(function(r,i){
    var x=L+4+i*((W-L-8)/N), y=H-B;
    [["water","var(--dw)"],["coffee","var(--dc)"],["juice","var(--dj)"],["sake","var(--ds)"]].forEach(function(s){
      var v=r[s[0]];if(!v)return;var hh=v/hi*(H-B-16);y-=hh;
      g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="2" fill="'+s[1]+'"/>';});
  });
  g+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-6)+'" y2="'+(H-B)+'" stroke="#5B8AC4" stroke-width="1"/>';
  keys.forEach(function(k,i){var x=L+4+i*((W-L-8)/N)+bw/2;
    g+='<text x="'+x.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="8.5" fill="'+WCOL[pd(k).getDay()]+'">'+WD[pd(k).getDay()]+'</text>';});
  return '<svg class="plot" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>'+legend;
}

/* =========== レシピ帳 =========== */
function renderRcp(){
  var names=Object.keys(S.recipes);
  var used={}; names.forEach(function(n){used[S.recipes[n].cat||"oka"]=1;});
  var tabs=CAT.filter(function(c){return used[c[0]];});
  if(!tabs.length)tabs=[CAT[1]];
  if(!used[rcpTab])rcpTab=tabs[0][0];
  var list=names.filter(function(n){return (S.recipes[n].cat||"oka")===rcpTab;}).sort();
  var label=(CAT.filter(function(c){return c[0]===rcpTab;})[0]||CAT[1])[1];

  var cnt={};
  Object.keys(S.days).forEach(function(k){(S.days[k].meals||[]).forEach(function(m){cnt[m.name]=(cnt[m.name]||0)+1;});});
  list.sort(function(a,b){return (cnt[b]||0)-(cnt[a]||0);});

  var body='<div style="font-size:10.5px;color:#9DB6D3;letter-spacing:.16em">レシピ帳</div>'
   +'<div style="font-size:18px;margin-bottom:10px">'+esc(label)+'</div>';
  if(!list.length)body+='<p class="empty">まだありません。食事を記録すると、ここに貯まります。</p>';
  else{
    body+='<div class="rule">';
    list.forEach(function(n){
      var r=S.recipes[n];
      body+='<div><span style="font-size:14px">'+esc(n)+'</span><span style="font-size:10px;color:#93AEC9">'+(cnt[n]||0)+'回</span></div>';
      if(r.items&&r.items.length)body+='<div><span class="chips">'+r.items.map(function(it){
        return '<span class="chip" style="cursor:default">'+esc(it.n)+(it.a?" "+it.a+(it.u||"g"):"")+'</span>';}).join("")+'</span></div>';
    });
    body+='<div></div></div>';
  }
  var tabsH=tabs.map(function(c,i){
    return '<button data-v="'+c[0]+'" class="'+(c[0]===rcpTab?"on":"")+'" style="background:'+TABCOL[i%TABCOL.length]+'">'+c[1]+'</button>';}).join("");
  $("p-rcp").innerHTML='<div class="bookwrap"><div class="book"><div class="spine"></div><div class="page">'+body+'</div></div>'
   +'<div class="tabs" id="rt">'+tabsH+'</div></div>';
  Array.prototype.forEach.call($("rt").children,function(b){
    b.onclick=function(){rcpTab=b.getAttribute("data-v");render();};});
}

/* =========== 豆知識帳 =========== */
function allFacts(){
  var out=[];
  Object.keys(FACTS).forEach(function(f){FACTS[f].f.forEach(function(x,i){
    out.push({f:f,i:i,k:x[0],t:x[1],n:FACTS[f].n,y:FACTS[f].y,seen:!!S.seen[factId(f,i)]});});});
  return out;
}
function renderFac(){
  var all=allFacts(), seenN=all.filter(function(p){return p.seen;}).length;
  if(!facTouched&&seenN){
    var okBig=BIG.filter(function(b){return all.some(function(p){return p.seen&&p.n.some(function(t){return t.split(":")[0]===b;});});});
    if(okBig.length&&okBig.indexOf(facBig)<0)facBig=okBig[0];
    var okGyo=GYO.filter(function(g){return all.some(function(p){return p.seen&&p.y===g;});});
    if(okGyo.length&&okGyo.indexOf(facGyo)<0)facGyo=okGyo[0];
  }
  var body='<div class="seg" id="ax"><button data-v="n">栄養素から</button><button data-v="f">食材から</button></div>';
  var tabsH="";
  if(facAxis==="n"){
    var subs=SUB[facBig]||[];
    body+='<div style="font-size:10.5px;color:#9DB6D3;letter-spacing:.14em">'+esc(facBig)+'</div>';
    if(subs.length){
      body+='<div class="nch" id="sb">'+subs.map(function(s){
        var c=all.filter(function(p){return p.seen&&p.n.indexOf(facBig+":"+s)>=0;}).length;
        return '<button data-v="'+esc(s)+'" class="'+(s===facSub?"on":(c?"":"z"))+'">'+esc(s)+' '+c+'</button>';}).join("")+'</div>';
    }
    var pick=all.filter(function(p){
      if(!p.seen)return false;
      return p.n.some(function(t){
        var a=t.split(":");
        if(a[0]!==facBig)return false;
        return !facSub||a[1]===facSub;});});
    body+=pick.length?renderFactList(pick):'<p class="empty">まだありません。食材を記録すると貯まります。</p>';
    tabsH=BIG.map(function(b,i){
      return '<button data-b="'+esc(b)+'" class="'+(b===facBig?"on":"")+'" style="background:'+TABCOL[i%TABCOL.length]+'">'+b+'</button>';}).join("");
  } else {
    body+='<div style="font-size:10.5px;color:#9DB6D3;letter-spacing:.14em">'+facGyo+'行</div>';
    var pick2=all.filter(function(p){return p.seen&&p.y===facGyo;});
    body+=pick2.length?renderFactList(pick2,true):'<p class="empty">まだありません。食材を記録すると貯まります。</p>';
    tabsH=GYO.map(function(g,i){
      var c=all.filter(function(p){return p.seen&&p.y===g;}).length;
      return '<button data-g="'+g+'" class="'+(g===facGyo?"on":"")+'" style="background:'+(c?TABCOL[i%TABCOL.length]:"#3F6089")+';opacity:'+(c?1:.55)+'">'+g+'</button>';}).join("");
  }
  body+='<p class="hint">'+seenN+' / '+all.length+' 集まりました。</p>';
  $("p-fac").innerHTML='<div class="bookwrap"><div class="book"><div class="spine"></div><div class="page">'+body+'</div></div>'
   +'<div class="tabs" id="ft">'+tabsH+'</div></div>';
  Array.prototype.forEach.call($("ax").children,function(b){b.classList.toggle("on",b.getAttribute("data-v")===facAxis);
    b.onclick=function(){facAxis=b.getAttribute("data-v");facSub=null;render();};});
  if($("sb"))Array.prototype.forEach.call($("sb").children,function(b){
    b.onclick=function(){var v=b.getAttribute("data-v");facSub=(facSub===v?null:v);render();};});
  Array.prototype.forEach.call($("ft").children,function(b){
    b.onclick=function(){ facTouched=true; if(b.getAttribute("data-b")){facBig=b.getAttribute("data-b");facSub=null;} else facGyo=b.getAttribute("data-g"); render();};});
  Array.prototype.forEach.call($("p-fac").querySelectorAll("[data-fk]"),function(b){
    b.onclick=function(){var a=b.getAttribute("data-fk").split("|");factSheet(a[0],+a[1]);};});
}
function renderFactList(list,byFood){
  var g={};list.forEach(function(p){(g[p.f]=g[p.f]||[]).push(p);});
  return Object.keys(g).map(function(f){
    return '<div style="margin-bottom:9px"><div style="font-size:14px;border-bottom:1px dashed var(--ln2);padding-bottom:3px;margin-bottom:4px">'+esc(f)+'</div>'
     +g[f].map(function(p){
       return '<button class="lk" data-fk="'+esc(p.f)+'|'+p.i+'" style="display:block;text-align:left;font-size:12.5px;color:var(--tx);text-decoration:none;padding:4px 0;border-bottom:1px dashed rgba(85,128,171,.5);width:100%">'
        +'<span style="color:#9DB6D3;font-size:10.5px">'+esc(KIND[p.k])+'</span><br>'+esc(p.t)+'</button>';}).join("")+'</div>';
  }).join("");
}
function factSheet(f,i){
  var x=FACTS[f].f[i];
  sheet(f,'<div style="font-size:10.5px;color:#9DB6D3;letter-spacing:.12em;margin-bottom:5px">'+esc(KIND[x[0]])+'</div>'
   +'<p style="font-size:14.5px;line-height:1.9;margin:0 0 12px">'+esc(x[1])+'</p>'
   +'<div class="chips">'+FACTS[f].n.map(function(t){return '<span class="chip" style="cursor:default">'+esc(t.replace(":","・"))+'</span>';}).join("")+'</div>'
   +'<div class="acts"><button class="q" id="x">とじる</button></div>',function(){$("x").onclick=closeSheet;});
}

/* =========== マイページ =========== */
function renderMy(){
  var h=Object.keys(S.days).sort(),lastW=null;
  for(var i=h.length-1;i>=0;i--){if(S.days[h[i]].weight!=null){lastW=S.days[h[i]].weight;break;}}
  var ht=S.profile.height,bmi=(ht&&lastW)?(lastW/Math.pow(ht/100,2)):null;
  var out='<h2 class="dt" style="font-size:18px;margin-bottom:11px">マイページ</h2>'
   +'<div class="cd"><div class="lb" style="margin-bottom:3px">からだのこと</div>'
   +'<div class="tally"><span style="font-size:13px;color:#C3D4E6">身長</span>'
     +'<button class="lk" id="eh" style="font-size:16px;color:var(--tx);text-decoration:none">'+(ht?ht+'<span class="u"> cm</span>':'<span style="color:var(--tx4)">入れる</span>')+'</button></div>'
   +'<div class="tally"><span style="font-size:13px;color:#C3D4E6">いちばん新しい体重</span><span style="font-size:16px">'+(lastW!=null?lastW+'<span class="u"> kg</span>':'<span style="color:var(--tx4)">‥‥</span>')+'</span></div>'
   +'<div class="tally" style="border:none"><span style="font-size:13px;color:#C3D4E6">BMI</span><span style="font-size:16px">'+(bmi?bmi.toFixed(1):'<span style="color:var(--tx4)">‥‥</span>')+'</span></div></div>'

   +'<div class="cd"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">'
     +'<span class="lb">マイ食品</span><button class="chip" id="af">＋ 登録</button></div>'
   +(S.myFoods.length?S.myFoods.map(function(f,i2){
       var b=[];if(f.kcal!=null)b.push(f.kcal+"kcal");if(f.protein!=null)b.push("たんぱく質"+f.protein+"g");
       return '<div class="tally"><span style="font-size:13px">'+esc(f.name)+'</span>'
        +'<button class="lk" data-f="'+i2+'">'+f.per+(f.unit||"g")+' / '+(b.join(" ")||"数値なし")+'</button></div>';}).join("")
     :'<p class="empty">まだありません。パッケージの成分表示を見ながら登録できます。</p>')
   +'</div>'

   +'<div class="cd"><div class="lb" style="margin-bottom:5px">保存とバックアップ</div>'
   +'<p class="hint" style="margin:0 0 9px">'+MODET[Store.mode()]+'</p>'
   +'<div class="r2"><button class="chip gh" id="ex" style="padding:8px">書き出す</button><button class="chip gh" id="im" style="padding:8px">読み込む</button></div>'
   +'<input type="file" id="imf" accept="application/json,.json" hidden>'
   +'<p class="hint">写真も含めて1つのファイルにまとめます。</p></div>'

   +'<div class="cd" style="margin-bottom:0"><div class="lb" style="margin-bottom:5px">このアプリについて</div>'
   +'<p class="hint" style="margin:0">目標・達成率・連続日数・判定は表示しません。記録のない日は空欄のままです。<br><br>'
   +'豆知識は日本食品標準成分表などをもとにした、体の中でのはたらきまでの内容です。<br><br>'
   +'平均はどれも、極端な日を除いて計算しています。</p>'
   +'<button class="chip gh" id="wp" style="margin-top:10px">記録をすべて消す</button></div>';
  $("p-my").innerHTML=out;

  $("eh").onclick=function(){
    sheet("身長",'<label class="f"><span class="k">身長（cm）</span><input type="number" inputmode="decimal" id="hv" value="'+(ht||"")+'"></label>'
     +'<div class="acts"><button class="q" id="c">やめる</button><button id="o">決定</button></div>',
     function(){$("c").onclick=closeSheet;$("o").onclick=function(){S.profile.height=num($("hv").value);save();closeSheet();render();};});};
  $("af").onclick=function(){foodSheet(-1);};
  Array.prototype.forEach.call($("p-my").querySelectorAll("[data-f]"),function(b){
    b.onclick=function(){foodSheet(+b.getAttribute("data-f"));};});

  $("ex").onclick=function(){
    var ms={};Object.keys(S.days).forEach(function(k){ms[mk(k)]=1;});
    var list=Object.keys(ms);
    Promise.all(list.map(loadPh)).then(function(){
      var pay={v:2,saved:new Date().toISOString(),state:S,photos:{}};
      list.forEach(function(m){pay.photos[m]=PH[m]||{};});
      var b=new Blob([JSON.stringify(pay)],{type:"application/json"}),u=URL.createObjectURL(b);
      var a=document.createElement("a");a.href=u;a.download="kiroku-"+dk(new Date())+".json";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(u);},2000);toast("書き出しました");});};
  $("im").onclick=function(){$("imf").click();};
  $("imf").onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){var p;try{p=JSON.parse(r.result);}catch(er){toast("読み込めませんでした");return;}
      if(!p||!p.state||!p.state.days){toast("記録のファイルではないようです");return;}
      sheet("読み込み",'<p style="font-size:14px;margin:0">いまの記録は、このファイルの中身に置きかわります。</p>'
       +'<div class="acts"><button class="q" id="c">やめる</button><button id="o">読み込む</button></div>',function(){
         $("c").onclick=function(){closeSheet();$("imf").value="";};
         $("o").onclick=function(){
           S=p.state;S.seen=S.seen||{};S.profile=S.profile||{};S.myFoods=S.myFoods||[];S.recipes=S.recipes||{};
           PH=p.photos||{};phL={};Object.keys(PH).forEach(function(m){phL[m]=1;Store.set(phk(m),JSON.stringify(PH[m]));});
           Store.set(KEY,JSON.stringify(S));sel=TK;closeSheet();$("imf").value="";toast("読み込みました");render();};});};
    r.readAsText(f);};
  $("wp").onclick=function(){
    sheet("記録をすべて消す",'<p style="font-size:14px;margin:0">これまでの記録、写真、マイ食品、レシピ帳がすべて消えます。元に戻せません。</p>'
     +'<div class="acts"><button class="q" id="c">やめる</button><button id="o">消す</button></div>',function(){
       $("c").onclick=closeSheet;
       $("o").onclick=function(){var old=Object.keys(PH);
         S={days:{},recipes:{},myFoods:[],profile:{},seen:{}};
         PH={};old.forEach(function(m){PH[m]={};Store.set(phk(m),"{}");});
         sel=TK;save();closeSheet();render();};});};
}
function foodSheet(idx){
  var f=idx>=0?S.myFoods[idx]:{name:"",per:100,unit:"g",kcal:null,protein:null,fat:null,carb:null,salt:null};
  var v=function(x){return x==null?"":x;};
  sheet(idx>=0?"食品を直す":"食品を登録する",
   '<label class="f"><span class="k">商品名・料理名</span><input type="text" id="fn" value="'+esc(f.name)+'" placeholder="◯◯チョコクッキー"></label>'
   +'<div class="r2"><label class="f"><span class="k">基準量</span><input type="number" inputmode="decimal" id="fp" value="'+f.per+'"></label>'
   +'<label class="f"><span class="k">単位</span><div class="unit" id="fu"><button data-v="g">g</button><button data-v="ml">ml</button></div></label></div>'
   +'<p class="hint" style="margin:-6px 0 12px">パッケージの「100gあたり」「1袋（◯g）あたり」の数字をそのまま写してください。</p>'
   +'<div class="r2"><label class="f"><span class="k">エネルギー kcal</span><input type="number" inputmode="decimal" id="fk" value="'+v(f.kcal)+'"></label>'
   +'<label class="f"><span class="k">たんぱく質 g</span><input type="number" inputmode="decimal" id="fq" value="'+v(f.protein)+'"></label></div>'
   +'<div class="r2"><label class="f"><span class="k">脂質 g</span><input type="number" inputmode="decimal" id="ff" value="'+v(f.fat)+'"></label>'
   +'<label class="f"><span class="k">炭水化物 g</span><input type="number" inputmode="decimal" id="fc" value="'+v(f.carb)+'"></label></div>'
   +'<label class="f"><span class="k">食塩相当量 g</span><input type="number" inputmode="decimal" id="fs" value="'+v(f.salt)+'"></label>'
   +'<div class="acts">'+(idx>=0?'<button class="q" id="del">消す</button>':'')+'<button id="ok">保存</button></div>',
   function(){
     var unit=f.unit||"g";
     function pu(){Array.prototype.forEach.call($("fu").children,function(b){b.classList.toggle("on",b.getAttribute("data-v")===unit);});}
     Array.prototype.forEach.call($("fu").children,function(b){b.onclick=function(){unit=b.getAttribute("data-v");pu();};});
     pu();
     $("ok").onclick=function(){
       var n=$("fn").value.trim();if(!n){toast("名前を入れてください");return;}
       var r={name:n,per:num($("fp").value)||100,unit:unit,kcal:num($("fk").value),protein:num($("fq").value),
         fat:num($("ff").value),carb:num($("fc").value),salt:num($("fs").value)};
       if(idx>=0)S.myFoods[idx]=r;else S.myFoods.push(r);
       save();closeSheet();render();};
     if($("del"))$("del").onclick=function(){S.myFoods.splice(idx,1);save();closeSheet();render();};});
}

/* =========== ルーティング =========== */
function go(p){cur=p;
  Array.prototype.forEach.call($("nav").children,function(b){b.classList.toggle("on",b.getAttribute("data-p")===p);});
  ["today","cal","rec","rcp","fac","my"].forEach(function(t){$("p-"+t).classList.toggle("on",t===p);});
  window.scrollTo(0,0);render();}
Array.prototype.forEach.call($("nav").children,function(b){b.onclick=function(){go(b.getAttribute("data-p"));};});

function draw(){
  if(cur==="today")renderToday();
  else if(cur==="cal")renderCal();
  else if(cur==="rec")renderRec();
  else if(cur==="rcp")renderRcp();
  else if(cur==="fac")renderFac();
  else if(cur==="my")renderMy();
}
function render(){
  var need={};need[mk(sel)]=1;
  if(cur==="cal")need[mkey(calM)]=1;
  Promise.all(Object.keys(need).map(loadPh)).then(draw);
}

sel=TK;calM=new Date(TODAY);recM=new Date(TODAY);
Store.init()
 .then(function(){return Store.get(KEY);})
 .then(function(v){ if(v){var p=JSON.parse(v);if(p&&p.days){S=p;S.seen=S.seen||{};S.profile=S.profile||{};S.myFoods=S.myFoods||[];S.recipes=S.recipes||{};}} })
 .catch(function(){})
 .then(function(){render();});
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
